[package]
name = "rustclip-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Platform-neutral clipboard history model and storage for AntiRustPaste"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
rustclip-imaging = { path = "../rustclip-imaging" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4"] }
