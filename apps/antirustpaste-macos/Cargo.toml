[package]
name = "antirustpaste"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A pure-Rust clipboard history manager for macOS"
publish = false

[dependencies]
block2 = "0.6.2"
dirs = "7.0.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
antirustpaste-core = { path = "../../crates/antirustpaste-core" }
antirustpaste-control = { path = "../../crates/antirustpaste-control" }
antirustpaste-imaging = { path = "../../crates/antirustpaste-imaging" }
antirustpaste-pdf = { path = "../../crates/antirustpaste-pdf" }
serde_json = "1.0.154"
