[package]
name = "antirustpaste-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local loopback HTTP control protocol for AntiRustPaste"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4"] }
